name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npm run build

      - name: Unit self-check (diff, 纯内存)
        run: npm run test:diff

      # 必须放在使用它的步骤之前：actions/cache 在自身位置恢复、在 job 结束时保存
      - name: Cache /data binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mg
          key: mg-bin-v2

      - name: Regression (node-tree 类型解码, 火车票公开文件)
        # /data 二进制不可字节复现, 用 MG_REGRESS_CACHE 落盘 + 上面的 actions/cache 复用,
        # 命中缓存时直接用本地快照跳过 47MB 下载。
        run: |
          mkdir -p "$HOME/.cache/mg"
          export MG_REGRESS_CACHE="$HOME/.cache/mg/regress.bin"
          [ -f "$MG_REGRESS_CACHE" ] && export MG_REGRESS_SRC="$MG_REGRESS_CACHE"
          npm run test:regress
        env:
          CI: true

      - name: Styles truth (样式/变量对浏览器真值, antd5 副本公开文件)
        # 公开样本缺快照时自动匿名下载 ~105MB 并写回该路径，由上面的 cache 复用；
        # 私有样本（新 ukey 编码）缺快照只跳过它自己，公开样本跑不起来则整体 fail。
        run: |
          mkdir -p "$HOME/.cache/mg"
          MG_STYLE_SRC_ANTD="$HOME/.cache/mg/styles-antd.bin" npm run test:styles

      - name: Fresh download smoke (防 /data 格式漂移)
        # 上面几步都吃 ~/.cache/mg 的快照，即「永远是同一个旧字节」。
        # 2026-09-22 的 P0 正是被这层缓存挡住：MasterGo 把 modern 头部签名的版本字节
        # 由 09 02 改成 09 04/09 16，写死整串的实现让所有**新下载**的文件解析成 0 页，
        # 而 CI 一直用旧快照（X=02）所以全绿。此步骤**刻意绕过缓存重新下载**并断言页数，
        # 是唯一能发现「服务端格式悄悄变了」的检查。
        run: npm run test:fresh
        env:
          CI: true

      - name: Bundle (esbuild 单文件 CJS)
        run: npm run build:bundle

      - name: E2E (spawn dist/index.cjs, JSON-RPC stdio 全链路)
        run: npm run test:e2e
